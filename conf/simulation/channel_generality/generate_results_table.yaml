# @package _global_

defaults:
  - /environment: env_psjra
  - /agent: ray_agent

name: channel_generality
mode: generate_results_table
workdir: ${hydra:runtime.output_dir}

# 参数：修改本块可调整数据源与输出路径
generate_results_table:
  data_root: data/channel_generality
  save_dir: outputs/tables/channel_generality
  scenario_ids: [5, 6, 7, 8, 9]
  # method_keys 默认与 METHOD_ORDER 一致，如需消融表可在此扩展
