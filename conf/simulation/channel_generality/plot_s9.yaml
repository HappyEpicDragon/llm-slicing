# @package _global_
# 快速查看 Scenario 9 上三个方法的对比结果
# 用法：pixi run sim plot_s9

defaults:
  - /simulation/channel_generality/_base
  - /simulation/channel_generality/groups/plot_common
  - _self_

mode: plot_s9

plot:
  plot_scenario_list: [9]

  baselines:
    - ppo_ha_weighted   # TEST_PPO_TEACHER
    - dt_baseline       # TEST_DT_BASELINE
    - dt                # DT_TESTING (IDT)
