# @package _global_

defaults:
  - /environment: single_scenario_env
  - /agent: ray_agent

name: channel_generality
mode: train_ppo_baseline_across_scenario
workdir: ${hydra:runtime.output_dir}

train_ppo_baseline_across_scenario:
  environment: ${environment}
  agent: ${agent}
  hydra_workdir: ${paths.channel_generality}/ppo_multi/checkpoints/scenario_0to4/latest
  asset:
    use_versioned_runs: true
    model_root: ${paths.channel_generality}/ppo_multi/checkpoints/scenario_0to4
    run_id: auto
    clean_before_run: false
    update_latest: true
  env_updates:
    mode: training
    scenario_mode: inside
    model_name: scenario_all_5
    inside:
      training:
        active_scenario_list: [0, 1, 2, 3, 4]

      testing:
        active_scenario_list: [5]

      evaluating:
        active_scenario_list: [0, 1, 2, 3, 4]