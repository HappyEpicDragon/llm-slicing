# @package _global_

defaults:
  - /simulation/channel_generality/_base
  - /simulation/channel_generality/defaults/ha_only
  - _self_

mode: test_ppo_ha_weighted

test_ppo_ha_weighted:
  environment: ${environment}
  model_path: ${paths.channel_generality}/ppo_ha_weighted/models/scenario_0to4/latest/best_model/best_model.zip

  # 多种子 × 多场景配置（5 seeds × 5 testing scenarios）
  test_seeds: [0, 1, 2, 3, 4]
  save_results: true
  save_root: ${paths.channel_generality}/ppo_ha_weighted
  clean_before_save: false

  env_updates:
    mode: testing
    scenario_mode: inside
    model_name: scenario_9
    inside:
      training:
        active_scenario_list: [5, 6, 7, 8, 9]
      evaluating:
        active_scenario_list: [5, 6, 7, 8, 9]
      testing:
        active_scenario_list: [5, 6, 7, 8, 9]