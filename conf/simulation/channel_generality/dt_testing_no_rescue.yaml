# @package _global_
# A3 消融：禁用 Critical Rescue (Phase 1)
# 继承 dt_testing.yaml，仅覆盖 disable_critical_rescue 开关

defaults:
  - /simulation/channel_generality/dt_testing  # 继承基础配置（绝对路径，避免组解析歧义）
  - _self_

name: channel_generality
mode: dt_testing

dt_testing:
  save_root: data/channel_generality/dt_no_rescue

environment:
  env_settings:
    disable_critical_rescue: true
