# @package _global_
# DT-baseline 与 ppo_baseline 共用 CommunicationEnv，需扁平 single_scenario_env（非 env_ha）
defaults:
  - /simulation/channel_generality/_base
  - /simulation/channel_generality/defaults/single_ray
  - _self_

mode: test_dt_baseline
# Required for ${workdir} interpolations inside env_ha (train_rl.logging, etc.)

test_dt_baseline:
  environment: ${environment}

  model_path: ${paths.channel_generality}/dt_baseline/dt_model/final_dt_baseline.pth
  meta_path: ${paths.channel_generality}/dt_baseline/dataset/metadata.json

  target_rtg: 0.0
  test_scenarios: [5, 6, 7, 8, 9]
  test_seeds: [0]
  n_episodes: 100
  device: cuda

  save_root: ${paths.channel_generality}/dt_baseline/eval_ood

  init_episode: 0
  max_episode: 100

  model:
    context_len: 20
    embed_dim: 512
    n_layer: 6
    n_head: 8
    activation: relu
    dropout: 0.1
