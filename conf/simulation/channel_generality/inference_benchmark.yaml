  save_dir: ${paths.channel_generality}/inference_benchmark
  ppo_ha_model_path: ${paths.channel_generality}/ppo_ha_weighted/models/scenario_0
  ppo_lagrangian_model_path: ${paths.channel_generality}/ppo_lagrangian/models/scen_all_seed0
