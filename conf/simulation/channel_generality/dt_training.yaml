# @package _global_

defaults:
  - /environment: env_ha

name: channel_generality
mode: dt_training
workdir: ${hydra:runtime.output_dir}

dt_training:
  environment: ${environment}
  # ============================================================
  # Decision Transformer 训练配置
  # ============================================================
  train_dt:
    device: cuda
    cpu_threads: 2   # PyTorch/NumPy per-process CPU threads; 2 is enough for GPU training
    use_amp: true    # FP16 mixed precision; safe after 3D mask fix

    # --- 数据集 ---
    dataset:
      base_dir: /root/decision_transformer_slicing/data/channel_generality/dt/dataset/
      train_path: training
      val_path: evaluating
      meta_path: metadata.json
      rtg_scale: 100000.0  # 归一化 RTG
      num_workers: 4

    # --- 模型架构 ---
    model:
      context_len: 20
      embed_dim: 512
      n_layer: 12
      n_head: 16
      activation: "relu"
      dropout: 0.1
      act_dim: 30

    # --- 优化器 ---
    optimizer:
      learning_rate: 1.0e-4 # Adam is adaptive; no LR scaling needed when increasing batch_size
      weight_decay: 1.0e-3
      batch_size: 3072
      epochs: 50
      warmup_steps: 1000

    # --- 保存与日志 ---
    saving:
      save_path: /root/decision_transformer_slicing/data/channel_generality/dt/model/latest
      save_best_only: true
      log_interval: 10
      asset:
        use_versioned_runs: true
        model_root: /root/decision_transformer_slicing/data/channel_generality/dt/model
        run_id: auto
        clean_before_run: false
        update_latest: true

    # --- 闭环评估 (Closed-loop Evaluation) ---
    evaluation:
      active: true
      eval_freq_epoch: 3  # 每多少个 epoch 在真实环境跑一次
      n_eval_episodes: 5
      target_rtg: -100.0 # 推理时期望最优回报（sym-log≈-4.6，对应训练数据中最好的轨迹水平）
