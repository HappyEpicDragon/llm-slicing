# @package _global_
# PPO-v2 teacher training on EnvV2 (violation reward, rich obs, ordering action).
# Run: pixi run sim channel_generality/train_ppo_v2 train_ppo_v2.scenarios=[0] train_ppo_v2.extractor=mlp

defaults:
  - /environment: env_ha

name: channel_generality
mode: train_ppo_v2
workdir: ${hydra:runtime.output_dir}

train_ppo_v2:
  environment: ${environment}

  # Which training scenario(s). Single: [0]. Joint: [0,1,2,3,4].
  scenarios: [0]
  extractor: mlp            # mlp | slice_attn

  ppo:
    total_timesteps: 400000
    seed: 42
    ent_coef: 0.05
    n_steps: 512
    # SubprocVecEnv parallel envs (requires .npz channel files).
    # Each env starts at a different episode offset → diverse rollout data.
    # Recommended: 12 for 1-model-per-GPU; 1 for multi-model-per-GPU.
    n_envs: 12
    device: cuda

  # Where to save checkpoints, best_model, final_model
  save_dir: data/channel_generality/dt_v2_mean_rwd/ppo_s0
