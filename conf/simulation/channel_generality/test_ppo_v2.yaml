# @package _global_
# Evaluate a trained PPO-v2 model on held-out episodes (ep 60-79, "testing" mode).
# Run: pixi run sim channel_generality/test_ppo_v2 \
#        test_ppo_v2.model_path=<path> test_ppo_v2.test_scenarios=[5,6,7,8,9]

defaults:
  - /environment: env_ha

name: channel_generality
mode: test_ppo_v2

test_ppo_v2:
  environment: ${environment}

  model_path: data/channel_generality/dt_v2_mean_rwd/ppo_s0/best_model/best_model.zip
  extractor: mlp

  test_scenarios: [0, 1, 2, 3, 4]   # override for generalization: [5,6,7,8,9]
  test_seeds: [0, 1, 2, 3, 4]
  n_episodes: 20                     # episodes per seed per scenario
  # OOD episode range override (null = use env_ha.yaml defaults: ep 60-79)
  init_episode: null
  max_episode: null
  device: cuda

  save_root: data/channel_generality/dt_v2_mean_rwd
  save_metric_key: ppo_s0_eval

  env_updates:
    mode: testing
    scenario_mode: inside
