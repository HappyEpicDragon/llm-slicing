# @package _global_

defaults:
  - /environment: env_ha

name: channel_generality
mode: test_ppo_ha
workdir: ${hydra:runtime.output_dir}
test_scenario: 4
model_scenario: 2 # ${test_scenario}

test_ppo_ha:
  environment: ${environment}
  model_base_dir: /root/decision_transformer_slicing/data/channel_generality/ppo_ha/models/
  model_path: /root/decision_transformer_slicing/data/channel_generality/ppo_ha/models/scenario_${model_scenario}/final_model_ha_best.zip
  env_updates:
    mode: testing
    scenario_mode: inside
    model_name: scenario_${test_scenario}
    inside:
      training:
        active_scenario_list:
          - ${test_scenario}
      evaluating:
        active_scenario_list:
          - ${test_scenario}
      testing:
        active_scenario_list:
          - ${test_scenario}