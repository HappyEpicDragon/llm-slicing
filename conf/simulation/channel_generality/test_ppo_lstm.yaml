# @package _global_

defaults:
  - /environment: env_psjra
  - /agent: ray_agent

name: channel_generality
mode: test_ppo_lstm
workdir: ${hydra:runtime.output_dir}

test_ppo_lstm:
  environment: ${environment}
  model_base_dir: /root/decision_transformer_slicing/data/channel_generality/ppo_lstm/models/
  env_updates:
    mode: testing
    scenario_mode: inside
    model_name: sla_rbg
    inside:
      training:
        active_scenario_list:
          - 0
      evaluating:
        active_scenario_list:
          - 0
      testing:
        active_scenario_list:
          - 0