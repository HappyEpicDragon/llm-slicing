# @package _global_
# CQL-v3：多头离散 Q 网络，直接学习 MultiDiscrete 动作
# 与 CQL-v2 的唯一区别：不将离散动作转为连续 PRB 比例，直接对 11-dim 离散空间训练

defaults:
  - /environment: env_ha

name: channel_generality
mode: train_cql_v3

train_cql_v3:
  # D-B dataset（与 CQL-v2 相同的数据来源，但直接读取 pkl 格式）
  dataset_dir: data/channel_generality/dt_v2_8exp/dataset_D-B/training

  # 模型输出根目录
  output_root: data/channel_generality/cql_v3_10k/models

  # 训练超参数
  n_steps: 10000
  batch_size: 256
  lr: 3.0e-4
  gamma: 0.99
  alpha: 1           # CQL 保守系数
  hidden_dim: 256
  target_update_freq: 200

  # 只训练 1 个 seed（测试时统一用这个模型）
  train_seeds: [0]

  device: cuda:0
