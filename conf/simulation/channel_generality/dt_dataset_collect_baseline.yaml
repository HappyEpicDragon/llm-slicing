# @package _global_

defaults:
  - /environment: single_scenario_env

name: channel_generality
mode: dt_dataset_collect_baseline
workdir: ${hydra:runtime.output_dir}

dt_dataset_collect_baseline:
  # 采集结果输出到 DT-Baseline 数据集目录
  output_path: data/channel_generality/dt_baseline/dataset

  # 每个场景采样规模
  episodes_per_scenario_training: 60
  episodes_per_scenario_evaluating: 20
  runs_per_episode: 40
  keep_count_per_episode: 10

  deterministic_ratio: 0.2
  # 限制单个 Ray 采集任务占用 CPU，减少并发，缓解 OOM。
  # 总并发约为 floor(总CPU / ray_cpus_per_task)。
  ray_cpus_per_task: 8
  gamma: 1.0
  device: "cuda"
  environment: ${environment}

  # Teacher 模型池（Baseline: 使用 PPO-Baseline 的 Ray checkpoint 实验目录）
  MODEL_ZOO:
    0: /root/decision_transformer_slicing/data/channel_generality/ppo_baseline/checkpoints/scenario_0/latest/ray_results/ppo_baseline
    1: /root/decision_transformer_slicing/data/channel_generality/ppo_baseline/checkpoints/scenario_1/latest/ray_results/ppo_baseline
    2: /root/decision_transformer_slicing/data/channel_generality/ppo_baseline/checkpoints/scenario_2/latest/ray_results/ppo_baseline
    3: /root/decision_transformer_slicing/data/channel_generality/ppo_baseline/checkpoints/scenario_3/latest/ray_results/ppo_baseline
    4: /root/decision_transformer_slicing/data/channel_generality/ppo_baseline/checkpoints/scenario_4/latest/ray_results/ppo_baseline

  CROSS_SCENARIO_IDS: [0, 1, 2, 3, 4]
