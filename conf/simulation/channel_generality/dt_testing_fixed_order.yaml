# @package _global_
# A4 消融：禁用 Demand-Aware Mapping（改为固定顺序映射）
# 继承 dt_testing.yaml，仅覆盖 mapping_mode 开关

defaults:
  - /simulation/channel_generality/dt_testing  # 继承基础配置（绝对路径，避免组解析歧义）
  - _self_

name: channel_generality
mode: dt_testing

dt_testing:
  save_root: data/channel_generality/dt_fixed_order

environment:
  env_settings:
    mapping_mode: fixed_order
