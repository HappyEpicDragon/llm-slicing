# @package _global_
# Lagrangian PPO (B2 Baseline) 测试配置

defaults:
  - /simulation/channel_generality/_base
  - /simulation/channel_generality/defaults/ha_only
  - _self_

mode: test_ppo_lagrangian

test_ppo_lagrangian:
  # 模型根目录（对应 train_ppo_lagrangian 默认 save_path）
  model_root: ${paths.channel_generality}/ppo_lagrangian/models
  prefer_latest: true
  strict_model_check: true
  # 训练模型 seed（与 test_seeds 解耦）：
  # 设为 0 表示“单模型 + 多环境seed测试”
  # 设为 null 时按 test_seeds 匹配同名模型（旧行为）
  model_seed: 0

  # 结果保存根目录
  save_root: ${paths.channel_generality}/ppo_lagrangian
  clean_before_save: false

  # 测试场景（eval set）
  test_scenarios: [5, 6, 7, 8, 9]

  # 测试 seeds
  test_seeds: [0, 1, 2, 3, 4]

  # 每个 seed 的 episode 数
  n_episodes: 100

  env_updates:
    mode: testing
    scenario_mode: inside
    model_name: lagrangian_ppo_test
