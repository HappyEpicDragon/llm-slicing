# @package _global_
# Train Decision Transformer on PPO teacher trajectories.
# Run: pixi run sim channel_generality/train_dt

defaults:
  - /simulation/channel_generality/_base
  - /simulation/channel_generality/defaults/ha_only
  - _self_

mode: train_dt

train_dt:
  environment: ${environment}

  # Input dataset (from collect_dt_data)
  dataset_dir: ${paths.channel_generality}/dt_mean_rwd/dataset
  # Output model directory
  save_dir: ${paths.channel_generality}/dt_mean_rwd/dt_model

  model:
    context_len: 20
    embed_dim: 512
    n_layer: 12
    n_head: 16
    activation: relu
    dropout: 0.1
    encoder_type: cross_attn       # cross_attn | mlp | slice_attn

  optimizer:
    epochs: 30
    batch_size: 1024
    lr: 1.0e-4
    rtg_scale: 100000.0
    total_epochs: null      # if set, scheduler spans total_epochs (used for resume)

  device: cuda
  grad_accum: 1
  # Set to path of epoch_N.pth to resume from checkpoint
  resume_from: null
