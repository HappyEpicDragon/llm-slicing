# @package _global_

defaults:
  - /environment: env_ha

name: channel_generality
mode: dt_dataset_collect
workdir: ${hydra:runtime.output_dir}

dt_dataset_collect:
  model_path: "${paths.channel_generality}/ppo_ha/models/scenario_0/final_model_ha_best.zip"
  output_path: ${workdir}
  episodes_per_scenario: 5      # 每个场景采集几条轨迹
  deterministic_ratio: 0.2      # 确定性策略比例
  gamma: 1.0                    # DT 的 RTG 衰减因子
  device: "cuda"
  environment: ${environment}
  env_updates:
    mode: training
    scenario_mode: inside
    model_name: scenario_0
    inside:
      training:
        active_scenario_list:
          - 0
      evaluating:
        active_scenario_list:
          - 0
      testing:
        active_scenario_list:
          - 0