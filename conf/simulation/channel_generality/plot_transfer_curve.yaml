# @package _global_

defaults:
  - /simulation/channel_generality/_base
  - _self_

mode: plot_transfer_curve

# 参数：修改本块可调整曲线数据路径与绘图选项
plot_transfer_curve:
  data_root: ${paths.channel_generality}/transfer_ppo
  idt_root: ${paths.channel_generality}/dt
  save_path: ${paths.figures_root}/channel_generality/transfer/fig7_transfer_curve
  metric: hp_violation_rate  # 可选: mean_return | hp_violation_rate | nhp_violation_rate
  target_scenarios: [7, 9]
  steps_per_ckp: 1000
  samples_per_step: 1
