# @package _global_
# PPO teacher training for DT transfer (violation reward, rich obs, ordering action).
# Run: pixi run sim channel_generality/train_dt_teacher train_dt_teacher.scenarios=[0] train_dt_teacher.extractor=mlp

defaults:
  - /simulation/channel_generality/_base
  - /simulation/channel_generality/defaults/ha_only
  - _self_

mode: train_dt_teacher

train_dt_teacher:
  environment: ${environment}

  # Which training scenario(s). Single: [0]. Joint: [0,1,2,3,4].
  scenarios: [0]
  extractor: mlp            # mlp | slice_attn

  ppo:
    total_timesteps: 400000
    seed: 42
    ent_coef: 0.05
    n_steps: 512
    # SubprocVecEnv parallel envs (requires .npz channel files).
    # Each env starts at a different episode offset → diverse rollout data.
    # Recommended: 12 for 1-model-per-GPU; 1 for multi-model-per-GPU.
    n_envs: 12
    device: cuda

  # Where to save checkpoints, best_model, final_model
  save_dir: ${paths.channel_generality}/dt_mean_rwd/ppo_s0
