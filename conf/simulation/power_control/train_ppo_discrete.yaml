# @package _global_
# Train PPO agent on K-user interference channel power control
# Usage: python main.py simulation=power_control/train_ppo_discrete

defaults:
  - /environment: power_control_env

name: power_control
mode: train_ppo_discrete
workdir: ${hydra:runtime.output_dir}

# Override environment for training
environment:
  K: 10
  N: 10
  episode_length: 1000
  seed: 42

train_ppo_discrete:
  environment: ${environment}
  ppo: ${ppo}

  training:
    total_timesteps: 1000000
    seed: 42
    verbose: 1

  asset:
    model_root: ${paths.power_control_models}
    run_id: auto
    update_latest: true

  output:
    model_name: ppo_power_control_K10
    results_path: ${paths.power_control_results}/train_K10
