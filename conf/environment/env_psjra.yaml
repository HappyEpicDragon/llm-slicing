env_settings:
  mode: training # training / evaluating / testing
  scenario_mode: inside # inside / cross
  model_name: null # 决定metrics保存的目录名称
  reward_type: sla_aware # sparse / mean / positive_sum / weighted / sla_aware

  env_state_config:
    initial_episode_number: 0
    max_number_episodes: 0

    episode_interval_start: 0
    episode_interval_end: 0
    episode_cross_scenario_skip: 0

    max_number_steps: 135
    max_channel_timesteps: 1000
    active_scenario_list: null

  inside:
    episode_cross_scenario_skip: 100
    training:
      seed: 10
      init_scenario_episode: 0
      max_scenario_episodes: 20
      active_scenario_list: null

    evaluating:
      seed: 15
      init_scenario_episode: 80
      max_scenario_episodes: 85
      active_scenario_list: null

    testing:
      seed: 15
      init_scenario_episode: 60 # 60
      max_scenario_episodes: 80 # 80
      active_scenario_list: null

  cross:
    episode_cross_scenario_skip: 1
    training:
      seed: 10
      init_scenario_episode: 0
      max_scenario_episodes: 1
      active_scenario_list: null

    evaluating:
      seed: 15
      init_scenario_episode: 0
      max_scenario_episodes: 1
      active_scenario_list: null

    testing:
      seed: 15
      init_scenario_episode: 0
      max_scenario_episodes: 1
      active_scenario_list: null



  components:
    basestations:
      max_number_basestations: 1
      max_number_power_level: 10
      total_power: 100
      noise_power: 10e-14
      bandwidths:
        - 100000000.0
      carrier_frequencies:
        - 2800000000.0
      num_available_rbs:
        - 135

    ues:
      max_number_ues: 25

    slices:
      max_number_slices: 5

    association:
      inside:
        class_path: src.basic_apis.network_slicing_business.components.MultSliceAssociationSeq
      cross:
        class_path: src.basic_apis.network_slicing_business.components.MultSliceAssociation

    channel:
      inside:
        class_path: src.basic_apis.network_slicing_business.components.QuadrigaChannelSeq
      cross:
        class_path: src.basic_apis.network_slicing_business.components.QuadrigaChannel

    traffic:
      class_path: src.basic_apis.network_slicing_business.components.MultSliceTraffic

    mobility:
      class_path: src.basic_apis.network_slicing_business.components.SimpleMobility

    metrics:
      class_path: src.basic_apis.network_slicing_business.components.Metrics
      save_hist: false

# ============================================================
# RL训练配置
# ============================================================
train_rl:
  # === 环境配置 ===
  environment:
    n_envs: 1                   # 并行环境数量（建议4-8）
    env_wrapper: null            # 环境包装器类型 [null, normalize, framestack]
    normalize_obs: false         # 是否标准化观测
    normalize_reward: false      # 是否标准化奖励

  # === 算法配置 ===
  algorithm:
    name: MaskablePPO           # 算法名称
    policy: MaskableLSTMPolicy  # 策略类型
    device: cpu                # 训练设备 [cuda, cpu]
    seed: 42                    # 随机种子

  # === PPO超参数 ===
  ppo:
    learning_rate: 3.0e-4       # 学习率
    n_steps: 2700               # 每次更新收集的步数（per env）
    batch_size: 64              # mini-batch大小
    n_epochs: 10                # 每次更新的训练轮数
    gamma: 0.99                 # 折扣因子
    gae_lambda: 0.95            # GAE lambda参数
    clip_range: 0.2             # PPO裁剪范围
    clip_range_vf: null         # Value function裁剪范围（null表示不裁剪）
    ent_coef: 0.01              # 熵正则化系数
    vf_coef: 0.5                # Value function损失系数
    max_grad_norm: 0.5          # 梯度裁剪阈值
    target_kl: null             # 目标KL散度（null表示不使用）

    # 学习率调度
    lr_schedule:
      enabled: true            # 是否启用学习率调度
      type: linear              # 调度类型 [linear, exponential, cosine]
      final_lr: 5.0e-5          # 最终学习率

  # === 网络架构 ===
  network:
    # Actor-Critic网络架构
    net_arch:
      pi: [128, 128]            # Actor网络隐藏层
      vf: [128, 128]            # Critic网络隐藏层

    activation_fn: ReLU         # 激活函数 [ReLU, Tanh, ELU]

    # 特征提取器配置
    feature_extractor:
      # 全局编码器
      global_encoder:
        hidden_dims: [64, 64]

      # CSI编码器
      csi_encoder:
        hidden_dims: [128, 128]

      # 切片分配编码器
      slice_alloc_encoder:
        hidden_dims: [128, 128]

      # 用户分配编码器
      user_alloc_encoder:
        hidden_dims: [256, 256]

      # Intent Drift编码器
      intent_drift_encoder:
        hidden_dims: [256, 128]

      # SLA编码器
      sla_encoder:
        hidden_dims: [128, 128]

      # 拓扑编码器
      topology_encoder:
        hidden_dims: [256, 128]

      # LSTM配置
      lstm:
        hidden_size: 256        # LSTM隐藏层大小
        num_layers: 2           # LSTM层数
        dropout: 0.2            # Dropout率（仅在num_layers>1时生效）

  # === 训练配置 ===
  training:
    total_timesteps: 1080000    # 总训练步数 20 (eps) * 1000 (channels) * 135 (rbs)
    log_interval: 10            # 日志记录间隔（episodes）
    progress_bar: true          # 是否显示进度条

    # 早停配置
    early_stopping:
      enabled: false            # 是否启用早停
      patience: 50              # 耐心值（多少次评估无改进则停止）
      min_delta: 0.01           # 最小改进阈值

  # === 评估配置 ===
  evaluation:
    eval_freq: 8192            # 评估频率（训练步数）
    n_eval_episodes: 100          # 每次评估的episode数
    deterministic: true         # 评估时是否使用确定性策略
    render: false               # 评估时是否渲染

    # 评估环境配置
    eval_env:
      n_envs: 1                 # 评估环境数量
      seed: 999                 # 评估环境随机种子

  # === 保存和日志配置 ===
  saving:
    # 模型保存
    save_freq: 50000            # 模型保存频率（训练步数）
    save_path: ${workdir}/${environment.env_settings.model_name}/models # 模型保存路径
    save_best_only: false       # 是否只保存最佳模型
    checkpoint_name_prefix: psjra_maskable_lstm

    # 最佳模型保存
    best_model:
      save_path: ${workdir}/${environment.env_settings.model_name}/best_model
      metric: mean_reward       # 评估指标 [mean_reward, success_rate]

  # TensorBoard日志
  logging:
    tensorboard_log: ${workdir}/${environment.env_settings.model_name}/logs/tensorboard
    log_path: ${workdir}/${environment.env_settings.model_name}/logs
    verbose: 1                  # 日志详细程度 [0, 1, 2]

  # === 回调配置 ===
  callbacks:
    # LSTM状态重置
    lstm_reset:
      enabled: true
      verbose: 1

    # 检查点保存
    checkpoint:
      enabled: true
      save_freq: ${environment.train_rl.saving.save_freq}
      save_path: ${environment.train_rl.saving.save_path}
      name_prefix: ${environment.train_rl.saving.checkpoint_name_prefix}

    # 评估回调
    eval:
      enabled: true
      eval_freq: ${environment.train_rl.evaluation.eval_freq}
      n_eval_episodes: ${environment.train_rl.evaluation.n_eval_episodes}
      deterministic: ${environment.train_rl.evaluation.deterministic}
      best_model_save_path: ${environment.train_rl.saving.best_model.save_path}


  # === 调试和实验配置 ===
  debug:
    check_env: false             # 是否检查环境有效性
    verbose_errors: true        # 是否详细输出错误信息
    profile: false              # 是否启用性能分析

  experiment:
    name: psjra_experiment      # 实验名称
    group: default              # 实验组
    tags: [psjra, maskable_ppo, lstm]  # 实验标签
    notes: Progressive Sequential Joint Resource Allocation with Masked LSTM-PPO
