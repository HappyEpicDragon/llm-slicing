# environment/env_settings.yaml (或你对应的配置文件名)

env_settings:
  mode: training
  scenario_mode: inside
  model_name: null

  env_state_config:
    initial_episode_number: 0
    max_number_episodes: 0

    episode_interval_start: 0
    episode_interval_end: 0
    episode_cross_scenario_skip: 0

    # [修改] One-Shot 模式下，每个 RL Step 对应一个物理 TTI
    # 所以 max_steps 应该等于 channel_timesteps (1000)
    # 意味着一个 Episode 会跑完整个 1秒钟的物理场景
    max_number_steps: 1000
    max_channel_timesteps: 1000
    active_scenario_list: null

  inside:
    episode_cross_scenario_skip: 100
    training:
      seed: 10
      init_scenario_episode: 0
      max_scenario_episodes: 20
      active_scenario_list: null

    evaluating:
      seed: 15
      init_scenario_episode: 80
      max_scenario_episodes: 85
      active_scenario_list: null

    testing:
      seed: 15
      init_scenario_episode: 60
      max_scenario_episodes: 80
      active_scenario_list: null

  # ... (cross 配置保持不变) ...

  cross:
    episode_cross_scenario_skip: 1
    training:
      seed: 10
      init_scenario_episode: 0
      max_scenario_episodes: 1
      active_scenario_list: null

    evaluating:
      seed: 15
      init_scenario_episode: 0
      max_scenario_episodes: 1
      active_scenario_list: null

    testing:
      seed: 15
      init_scenario_episode: 0
      max_scenario_episodes: 1
      active_scenario_list: null

  components:
    basestations:
      max_number_basestations: 1
      max_number_power_level: 1
      total_power: 100.0  # [修改] 确认基站功率限制 (之前代码写了40W，这里需对齐)
      noise_power: 10e-14
      bandwidths:
        - 100000000.0
      carrier_frequencies:
        - 2800000000.0
      num_available_rbs:
        - 135 # (27 RBGs * 5)

    ues:
      max_number_ues: 25

    slices:
      max_number_slices: 5

    association:
      inside:
        class_path: src.basic_apis.network_slicing_business.components.MultSliceAssociationSeq
      cross:
        class_path: src.basic_apis.network_slicing_business.components.MultSliceAssociation

    channel:
      inside:
        class_path: src.basic_apis.network_slicing_business.components.QuadrigaChannelSeq
      cross:
        class_path: src.basic_apis.network_slicing_business.components.QuadrigaChannel

    traffic:
      class_path: src.basic_apis.network_slicing_business.components.MultSliceTraffic

    mobility:
      class_path: src.basic_apis.network_slicing_business.components.SimpleMobility

    metrics:
      class_path: src.basic_apis.network_slicing_business.components.Metrics
      save_hist: false

# ============================================================
# RL训练配置 (One-Shot 适配版)
# ============================================================
train_rl:
  # === 环境配置 ===
  environment:
    n_envs: 1
    env_wrapper: null
    normalize_obs: false
    normalize_reward: false

  # === 算法配置 ===
  algorithm:
    name: MaskablePPO
    policy: MaskableActorCriticPolicy  # [修改] 不再使用 LSTM
    device: cpu                # 建议改为 cuda 如果有 GPU
    seed: 42

  # === PPO超参数 ===
  ppo:
    learning_rate: 1e-3       # [修改] 稍微调高，One-Shot 收敛更快
    n_steps: 256               # [修改] 收集更多样本再更新 (覆盖2个完整场景)
    batch_size: 64             # [修改] 增大 Batch Size
    n_epochs: 20
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.8
    clip_range_vf: null
    ent_coef: 0.01
    vf_coef: 0.5
    max_grad_norm: 0.5
    target_kl: null

    # 学习率调度
    lr_schedule:
      enabled: false
      type: linear
      final_lr: 5.0e-5

  # === 网络架构 ===
  network:
    # Actor-Critic网络架构 (MLP)
    net_arch:
#      pi: [512, 512, 256]       # [修改] 加深网络以处理 One-Shot 复杂决策
#      vf: [512, 512, 256]
      pi: [ 256, 256 ]
      vf: [ 256, 256 ]

    activation_fn: ReLU

    # 特征提取器配置 (参数传递给 CustomFeatureExtractor)
    feature_extractor:
      # 最终输出给 Policy 网络的特征维度
      features_dim: 256 # 512

      # ==================== 子编码器结构定义 ====================
      # 定义每个子模块的 MLP 隐藏层结构 (List[int])

      # 1. 全局信息编码器 (Input: ~4 dims)
      global_encoder:
        hidden_dims: [ 64, 64 ]

      # 2. 信道状态信息(CSI)编码器 (Input: Max_Users)
      csi_encoder:
        hidden_dims: [128, 64] # [ 128, 128 ]

      # 3. 切片分配历史编码器 (Input: 2 * Max_Slices)
      slice_alloc_encoder:
        hidden_dims: [ 128, 128 ]

      # 4. 用户分配历史编码器 (Input: 2 * Max_Users)
      # 输入维度较大，使用更深/更宽的网络
      user_alloc_encoder:
        hidden_dims: [ 256, 256 ]

      # 5. Intent Drift 编码器 (Input: Slices * Users * Metrics)
      # 输入维度最大 (约 375)，需要较强的压缩能力
      intent_drift_encoder:
        hidden_dims: [ 128, 64 ]

      # 6. SLA 配置编码器 (Input: Slices * Metrics * 2)
      sla_encoder:
        hidden_dims: [ 128, 128 ]

      # 7. 拓扑结构编码器 (Input: Slices * Users 矩阵)
      topology_encoder:
        hidden_dims: [ 256, 128 ]

  # === 训练配置 ===
  training:
    total_timesteps: 200000    # [修改] 增加总步数，One-Shot 跑得快，可以多跑点
    log_interval: 1             # [修改] 这是一个长 Episode (1000步)，所以每 1 个 Ep 记录一次
    progress_bar: true

    # 早停配置
    early_stopping:
      enabled: false
      patience: 100
      min_delta: 0.01

  # === 评估配置 ===
  evaluation:
    eval_freq: 8192            # [修改] 每 10000 步评估一次
    n_eval_episodes: 5         # 评估 10 个场景 (10 * 1000 steps)
    deterministic: false # true
    render: false

    eval_env:
      n_envs: 1
      seed: 999

  # === 保存和日志配置 ===
  saving:
    save_freq: 10000
    save_path: ${workdir}/${environment.env_settings.model_name}/models
    save_best_only: false
    checkpoint_name_prefix: psjra_oneshot # [修改] 前缀

    best_model:
      save_path: ${workdir}/${environment.env_settings.model_name}/best_model
      metric: mean_reward

  logging:
    tensorboard_log: ${workdir}/${environment.env_settings.model_name}/logs/tensorboard
    log_path: ${workdir}/${environment.env_settings.model_name}/logs
    verbose: 1

  # === 回调配置 ===
  callbacks:

    # 检查点保存
    checkpoint:
      enabled: true
      save_freq: ${environment.train_rl.saving.save_freq}
      save_path: ${environment.train_rl.saving.save_path}
      name_prefix: ${environment.train_rl.saving.checkpoint_name_prefix}

    # 评估回调
    eval:
      enabled: true
      eval_freq: ${environment.train_rl.evaluation.eval_freq}
      n_eval_episodes: ${environment.train_rl.evaluation.n_eval_episodes}
      deterministic: ${environment.train_rl.evaluation.deterministic}
      best_model_save_path: ${environment.train_rl.saving.best_model.save_path}

  # === 调试和实验配置 ===
  debug:
    check_env: false
    verbose_errors: true
    profile: false

  experiment:
    name: psjra_oneshot_experiment      # [修改]
    group: oneshot                      # [修改]
    tags: [psjra, maskable_ppo, oneshot] # [修改]
    notes: Global One-Shot Resource Allocation with Power Scaling