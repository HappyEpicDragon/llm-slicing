[workspace]
channels = [
  "nvidia",                     # nvidia 运行时库
  "conda-forge",                # 主要依赖来源
  "pytorch"                     # pytorch 特有包
]
name = "decision_transformer_slicing"
platforms = ["linux-64"]
version = "0.1.0"

[system-requirements]
cuda = "11.4"                   # 驱动 470 最高支持 CUDA 11.4

[tasks]
train = "python simu.py"
check-ray = "python check_env.py"
tensorboard_show = "tensorboard --logdir /root/decision_transformer_slicing/outputs/runs/"
sim = "python -c \"import sys, subprocess; subprocess.run(['python', 'main.py', f'simulation=channel_generality/{sys.argv[1]}'] + sys.argv[2:])\""
xai = "python -c \"import sys, subprocess; subprocess.run(['python', 'main.py', f'simulation=explainable_ai/{sys.argv[1]}'] + sys.argv[2:])\""

# --------------------------------------------------------------------
# CONDA DEPENDENCIES
# --------------------------------------------------------------------

[dependencies]
python = ">=3.10,<3.11"

# --- PyTorch Stack (CUDA 11.3, 兼容驱动 470) ---
pytorch       = { version = ">=1.12,<1.13", channel = "pytorch" }
torchvision   = { version = ">=0.13,<0.14", channel = "pytorch" }
torchaudio    = { version = ">=0.12,<0.13", channel = "pytorch" }
cudatoolkit   = { version = "11.3.*" }
numpy = ">=1.20,<2.0"

# --- Ray RLlib Stack ---
ray-data  = "*"
ray-train = "*"
ray-tune  = "*"
ray-serve = "*"
ray-rllib = "*"

matplotlib = "*"
pyqt       = "*"

# --- Other Dependencies ---
scikit-learn    = "*"
tqdm            = "*"
h5py            = "*"
imageio         = "*"
imageio-ffmpeg  = "*"
tensorboard     = "*"
hydra-core      = "*"
scikit-image    = "*"
lz4             = "*"

# --- Hugging Face Ecosystem ---
transformers = ">=4.30,<4.40"
accelerate   = ">=0.20,<0.30"
datasets     = "*"

# --- RL & Simulation ---
gymnasium         = ">=0.28"
pettingzoo        = "*"
dm-tree           = "*"
mujoco            = "*"
pybullet          = "*"
setuptools        = "==69.5.1"
seaborn           = ">=0.13.2,<0.14"
stable-baselines3 = ">=2.0,<2.3"
sb3-contrib       = ">=2.0,<2.3"
xgboost           = ">=3.0.4,<4"
cvxpy             = ">=1.7.2,<2"
osqp              = ">=0.6.7.post3,<0.7"
ecos              = ">=2.0.14,<3"
scs               = ">=3.2.7.post2,<4"
glpk              = ">=5.0,<6"
coincbc           = ">=2.10.12,<3"
coin-or-cbc       = ">=2.10.12,<3"
pathlib           = ">=1.0.1,<2"
wandb             = ">=0.22.3,<0.23"
scipy             = ">=1.15.2,<2"
graphviz          = ">=2.50,<9"
python-graphviz   = ">=0.21,<0.22"
ittapi = ">=3.26.7,<4"
# d3rlpy            = ">=2.8.1,<3"        # 注意：可能需要 PyTorch 2.x，解析失败则去掉
mkl = "<2024"
d3rlpy = ">=2.0.4,<3"

