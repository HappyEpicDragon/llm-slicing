name: power_control_reward
description: Multi-cell power control with QoS and fairness constraints
type: reward_evolution
domain: wireless_communications

problem_sizes:
  - 4   # K=4 TX-RX pairs
  - 8   # K=8 TX-RX pairs
  - 10  # K=10 TX-RX pairs
  - 16  # K=16 TX-RX pairs

metrics:
  - sum_rate          # Average sum-rate (bps/Hz)
  - qos_violation_rate  # Fraction of users below R_min
  - jains_fairness    # Jain's fairness index

fitness:
  type: minimization
  formula: "10.0 * qos_violation_rate + max(0, τ(K) - jains_fairness)"
  description: "Penalize QoS violations and fairness gaps"

baseline:
  name: "Nasir-Guo + QoS + Fairness"
  file: baseline_reward.py
  description: "Hybrid extension of Nasir & Guo Asilomar 2020"

environment_variables:
  PC_PROJECT_ROOT: "Project root directory"
  PC_PROXY_TRAIN_RATIO: "Training timesteps ratio (default: 1.0)"
  PC_SEED: "Random seed (default: 42)"

references:
  - "Nasir & Guo, Multi-Agent Deep Reinforcement Learning for Dynamic Power Allocation in Wireless Networks, Asilomar 2020"
  - "Shi et al., An Iteratively Weighted MMSE Approach to Distributed Sum-Utility Maximization for a MIMO Interfering Broadcast Channel, IEEE TSP 2011"
